; PlatformIO project for the EE 4953 alarm clock.
;
; IMPORTANT: this uses the pioarduino platform, not the one in PlatformIO's
; own registry. Espressif stopped updating the registry platform, so
; `platform = espressif32` still installs Arduino core 2.x - and this code
; needs core 3.x for ledcAttach() and the driver/pulse_cnt.h PCNT API.
; Arduino IDE users already get 3.x from the Espressif board manager URL,
; so this keeps both toolchains on the same core.
[env:esp32-s3-devkitc-1]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board     = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Console on UART0 -> the socket silkscreened UART. Also leaves GPIO19/20
; alone. If you plug into the other socket you get a silent serial monitor.
; The N16R8 carries OCTAL PSRAM and 16 MB flash. The stock board definition
; assumes quad, which makes the boot log complain that PSRAM is "not
; connected". qio_opi = QIO flash + OPI PSRAM, which is what this module is.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    olikraus/U8g2 @ ^2.35.19
    adafruit/RTClib @ ^2.1.4
